name: ci

on:
  push:
    branches: [main]

jobs:
  publicar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: |
          docker build \
            -t ghcr.io/ralphsblue/shoppee-cybersec:${{ github.sha }} \
            -t ghcr.io/ralphsblue/shoppee-cybersec:latest \
            .

      - name: Push
        run: docker push --all-tags ghcr.io/ralphsblue/shoppee-cybersec
  deploy:
    needs: publicar
    runs-on: ubuntu-24.04
    environment: producao
    concurrency:
      group: producao
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Executar deploy na EC2
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          PASTA: Palestra-Cybersec---IFSP-Shopee-Clone
        run: |
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA" \
            --parameters "commands=[\"sudo -iu ubuntu git -C $PASTA fetch origin\",\"sudo -iu ubuntu git -C $PASTA reset --hard $SHA\",\"sudo -iu ubuntu $PASTA/deploy/atualizar.sh $SHA\"]" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = "Success" ]